name: Build

# The app was written on Linux, where no Swift compiler exists. This is what tells us whether it
# still compiles, without needing anyone at a Mac.
#
# Builds for the device SDK with signing switched off. That is the combination proven to work by
# hand, and it avoids depending on a simulator runtime being installed on the runner.
#
# It had never once compiled. Every run from the first push to 2026-08-18 died before reaching the
# Build step, on `sudo xcodebuild -downloadPlatform iOS`, with "Unable to connect to simulator" and
# exit 70. That step contradicted the two lines above it: the whole point of a device build is that
# no simulator runtime is needed, and macos-latest already ships the iOS device SDK. So the step was
# not flaky, it was asking for the one thing this design had decided not to depend on. Removed.

on:
  push:
    # promo/ is a marketing website in plain HTML and ships nothing into the app target. Without
    # this line every copy edit on it spends 45 minutes of macOS runner time rebuilding Swift that
    # did not change.
    paths-ignore:
      - 'promo/**'
  pull_request:
    paths-ignore:
      - 'promo/**'
  workflow_dispatch:

jobs:
  structure:
    name: Project structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_project.py

  build:
    name: Compile
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode found"
          xcodebuild -version

      # This step used to walk /Applications/Xcode_26*.app and switch to the FIRST match, which in
      # shell glob order is 26.0.1. The runner's default is already 26.6, so every run silently
      # downgraded the toolchain by six minor versions before building anything. Now it only
      # switches when the default is not an Xcode 26 at all, and then takes the newest one.
      - name: Use the newest Xcode 26
        run: |
          current=$(xcodebuild -version | head -1)
          echo "runner default: $current"
          case "$current" in
            *"Xcode 26"*)
              echo "already on Xcode 26, leaving the default alone"
              ;;
            *)
              newest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
              if [ -z "$newest" ]; then
                echo "::error::no Xcode 26 on this runner, and AlarmKit needs it"
                exit 1
              fi
              sudo xcode-select -s "$newest"
              ;;
          esac
          xcodebuild -version

      # Printed on every run, not only on failure. Two questions on this project went unanswered
      # for weeks because the diagnostic was gated behind the error path. If the build below ever
      # fails for a missing SDK, the answer is already above it in the log.
      - name: What SDKs this runner actually has
        run: xcodebuild -showsdks

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project OneAlarm.xcodeproj \
            -scheme OneAlarm \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Confirm the AlarmKit usage description reached the bundle
        run: |
          set -o pipefail
          app=$(find ~/Library/Developer/Xcode/DerivedData -name "OneAlarm.app" -path "*Debug-iphoneos*" | head -1)
          echo "bundle: $app"
          if plutil -p "$app/Info.plist" | grep -q NSAlarmKitUsageDescription; then
            echo "NSAlarmKitUsageDescription present"
          else
            echo "::error::NSAlarmKitUsageDescription missing from the built Info.plist. AlarmKit cannot schedule anything without it."
            exit 1
          fi
